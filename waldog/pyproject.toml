[project]
name = "waldog"
version = "0.1.0"
description = "Where's Waldog — hide pet cutouts in a rendered OME-Zarr microscopy image"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ngio",
    "numpy",
    "pillow",
    "scipy",
]

[project.scripts]
waldog = "waldog.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waldog"]

# Runtime-tunable settings. The server re-reads this file when it changes
# (no restart needed); a broken file keeps the last good values.

[scoring]
max_score = 1000
sigma = 0.2 # accuracy scale: relative-error e-folding (0.2 = being 20% off costs a factor e)
tau = 6.0   # speed budget in seconds per cell

[truth_overrides]
# Emergency per-ROI overrides. The normal place to edit the game's ground
# truth is data/derived/game.json (id + shown name + true_count); a value
# here wins over it, e.g.:
# roi_3 = 210

[project]
name = "scientifica"
version = "0.1.0"
description = "Scientifica bioimage-analysis event dashboard: precomputed pipeline, live re-compute, cell-counting game"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cellpose>=4.2,<5",
    "scikit-image>=0.24",
    "numpy>=2,<3",
    "ngio>=1.1.0,<2",
    "zarr>=3.1.6",
    "pandas>=2.2",
    "pillow",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pywavelets>=1.9.0",
    "scipy",
    "tifffile",
]

[project.scripts]
scientifica-pipeline = "scientifica.pipeline.run:main"
scientifica-server = "scientifica.server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientifica"]

[tool.uv.workspace]
members = ["waldog"]

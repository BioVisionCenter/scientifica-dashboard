[project]
name = "scientifica"
version = "0.1.0"
description = "Scientifica bioimage-analysis event dashboard: precomputed pipeline, live re-compute, cell-counting game"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cellpose>=3.1,<4",
    "scikit-image>=0.24",
    "numpy",
    "pillow",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.scripts]
scientifica-pipeline = "scientifica.pipeline.run:main"
scientifica-patches = "scientifica.pipeline.game_patches:main"
scientifica-server = "scientifica.server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientifica"]
